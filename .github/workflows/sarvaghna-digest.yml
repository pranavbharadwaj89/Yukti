name: SARVAGHNA Daily Digest

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  digest:
    name: SARVAGHNA Status Digest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore .NET Dependencies
        run: dotnet restore Yukti.sln

      - name: Build Solution
        run: dotnet build Yukti.sln --configuration Release --no-restore

      - name: Install Playwright browsers
        run: pwsh tests/Yukti.Orchestration.Tests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Run SARVAGHNA 5-Agent Crew
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node sarvaghna/sarvaghna.mjs --crew || true
        # The crew's own exit code reflects mission verdict (ship vs retry),
        # not pipeline health — a low coverage score is a finding to report
        # in the digest, not a reason to fail this workflow.

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SARVAGHNA digest report
        run: node sarvaghna/reporting/generate_report.mjs digest > /tmp/sarvaghna-digest.json

      - name: Email SARVAGHNA digest report
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ID }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
        run: python sarvaghna/reporting/send_email.py /tmp/sarvaghna-digest.json
