name: Yukti Platform CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # D6-T1: a real Postgres, with real RLS policies applied via migrations — without this, every
    # test that needs a live database (TenantIsolationTests, AuditEntryGrantsTests) silently
    # Skip()s rather than fails, so CI never actually proved RLS/grants enforcement despite the
    # tests existing. Same throwaway, well-known-placeholder-credential service every other job
    # here already uses (api-types-drift/ai-off/e2e) — safe because it's a fresh container, never
    # persisted, torn down at the end of this one job run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: yukti
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Verify formatting
      run: dotnet format --verify-no-changes

    - name: Build Solution (warnings as errors)
      run: dotnet build --no-restore -warnaserror -c Release

    - name: Install Playwright browsers
      run: pwsh tests/Yukti.Orchestration.Tests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

    - name: Install dotnet-ef
      run: dotnet tool install --global dotnet-ef --version 8.0.11

    # D6-T1: applies every migration, including AddRowLevelSecurity and AddYuktiAppRuntimeRole —
    # the latter creates yukti_app with its own documented placeholder password (safe in this
    # throwaway container; never the real credential, see that migration's own comment).
    - name: Apply EF migrations to the throwaway database
      env:
        PGHOST: localhost
        PGPORT: 5432
        PGDATABASE: yukti
        PGUSERNAME: postgres
        PGPASSWORD_: password
      run: |
        CONN="Host=$PGHOST"
        CONN="$CONN;Port=$PGPORT"
        CONN="$CONN;Database=$PGDATABASE"
        CONN="$CONN;Username=$PGUSERNAME"
        CONN="$CONN;Password=$PGPASSWORD_"
        export ConnectionStrings__Yukti="$CONN"
        dotnet ef database update --project src/Yukti.Infrastructure --startup-project src/Yukti.Api --connection "$CONN"

    # D6-T1/FR-AUDIT-03: a second connection, as the genuinely non-superuser yukti_app role —
    # ConnectionStrings__Yukti above authenticates as the table OWNER (postgres), which PostgreSQL
    # always lets bypass RLS regardless of FORCE, so it alone can't prove anything RLS/grants
    # tests check. Both assembled from separate PG*/YUKTI_APP_* pieces at shell runtime, same
    # convention as every other job's migration step in this file, so no literal credential
    # string sits in the YAML diff.
    # D6-T6: a dedicated, named gate for the five security proofs (D6-T1–T5), so a failure here
    # reads as "a security proof broke" in the PR's check list, not buried inside the generic full
    # suite below. Same filter every one of those tasks' own ✔ command already names; this doesn't
    # change what runs, it gives it its own auditable step. Kept inside this job rather than split
    # into a parallel one — total suite time is well under the spec's 10-minute split threshold
    # (full solution build+test completes in well under two minutes on this size of codebase).
    - name: Security gate — RLS, RBAC, Vault, secret leakage, audit, SSRF (D6-T1–T5)
      env:
        PGHOST: localhost
        PGPORT: 5432
        PGDATABASE: yukti
        PGUSERNAME: postgres
        PGPASSWORD_: password
        YUKTI_APP_USERNAME: yukti_app
        YUKTI_APP_PASSWORD: placeholder-rotate-immediately
      run: |
        CONN="Host=$PGHOST"
        CONN="$CONN;Port=$PGPORT"
        CONN="$CONN;Database=$PGDATABASE"
        CONN="$CONN;Username=$PGUSERNAME"
        CONN="$CONN;Password=$PGPASSWORD_"
        export ConnectionStrings__Yukti="$CONN"
        RUNTIME_CONN="Host=$PGHOST"
        RUNTIME_CONN="$RUNTIME_CONN;Port=$PGPORT"
        RUNTIME_CONN="$RUNTIME_CONN;Database=$PGDATABASE"
        RUNTIME_CONN="$RUNTIME_CONN;Username=$YUKTI_APP_USERNAME"
        RUNTIME_CONN="$RUNTIME_CONN;Password=$YUKTI_APP_PASSWORD"
        export ConnectionStrings__YuktiRuntime="$RUNTIME_CONN"
        dotnet test --no-build -c Release --verbosity normal \
          --filter "FullyQualifiedName~TenantIsolation|FullyQualifiedName~Authorization|FullyQualifiedName~Vault|FullyQualifiedName~SecretLeak|FullyQualifiedName~Audit|FullyQualifiedName~OutboundGuard"

    - name: Run .NET Unit & Integration Tests
      env:
        PGHOST: localhost
        PGPORT: 5432
        PGDATABASE: yukti
        PGUSERNAME: postgres
        PGPASSWORD_: password
        YUKTI_APP_USERNAME: yukti_app
        YUKTI_APP_PASSWORD: placeholder-rotate-immediately
      run: |
        CONN="Host=$PGHOST"
        CONN="$CONN;Port=$PGPORT"
        CONN="$CONN;Database=$PGDATABASE"
        CONN="$CONN;Username=$PGUSERNAME"
        CONN="$CONN;Password=$PGPASSWORD_"
        export ConnectionStrings__Yukti="$CONN"
        RUNTIME_CONN="Host=$PGHOST"
        RUNTIME_CONN="$RUNTIME_CONN;Port=$PGPORT"
        RUNTIME_CONN="$RUNTIME_CONN;Database=$PGDATABASE"
        RUNTIME_CONN="$RUNTIME_CONN;Username=$YUKTI_APP_USERNAME"
        RUNTIME_CONN="$RUNTIME_CONN;Password=$YUKTI_APP_PASSWORD"
        export ConnectionStrings__YuktiRuntime="$RUNTIME_CONN"
        dotnet test --no-build -c Release --verbosity normal

    - name: Build Docker Container
      run: docker build -t yukti-platform:latest .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/yukti-gui

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: apps/yukti-gui/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Typecheck
      run: npm run typecheck

    - name: Test
      run: npm test

    - name: Build
      run: npm run build

  # D4-T1: the frontend's generated API types (apps/yukti-gui/src/api/generated)
  # must match what the backend actually serves. This job builds the real
  # backend, migrates a throwaway Postgres, boots it, regenerates the types
  # from its live swagger.json, and fails if that differs from what's
  # committed - catching a backend change that wasn't regenerated for.
  api-types-drift:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: yukti
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: apps/yukti-gui/package-lock.json

    - name: Restore and build backend
      run: dotnet restore && dotnet build --no-restore -c Release

    - name: Install dotnet-ef
      run: dotnet tool install --global dotnet-ef --version 8.0.11

    # The throwaway Postgres service above is an ephemeral, isolated
    # container that exists only for this one job run (same well-known
    # placeholder credential every GitHub Actions Postgres-service example
    # uses). Its connection string is still assembled from separate PG*
    # pieces at shell runtime, rather than written as one literal string, so
    # it never looks like a real committed credential in the diff.
    # dotnet ef's --connection flag doesn't stop the design-time tooling
    # (via Program.cs's own host build, or YuktiDbContextFactory - EF tries
    # both) from independently reading ConnectionStrings:Yukti, and throwing
    # if it's missing. Locally that quietly succeeds via dotnet user-secrets;
    # CI has no such file, so this env var is what actually supplies it here.
    - name: Apply EF migrations to the throwaway database
      env:
        PGHOST: localhost
        PGPORT: 5432
        PGDATABASE: yukti
        PGUSERNAME: postgres
        PGPASSWORD_: password
      run: |
        CONN="Host=$PGHOST"
        CONN="$CONN;Port=$PGPORT"
        CONN="$CONN;Database=$PGDATABASE"
        CONN="$CONN;Username=$PGUSERNAME"
        CONN="$CONN;Password=$PGPASSWORD_"
        export ConnectionStrings__Yukti="$CONN"
        dotnet ef database update --project src/Yukti.Infrastructure --startup-project src/Yukti.Api --connection "$CONN"

    - name: Start the API against it
      env:
        ASPNETCORE_ENVIRONMENT: Production
        PGHOST: localhost
        PGPORT: 5432
        PGDATABASE: yukti
        PGUSERNAME: postgres
        PGPASSWORD_: password
      run: |
        CONN="Host=$PGHOST"
        CONN="$CONN;Port=$PGPORT"
        CONN="$CONN;Database=$PGDATABASE"
        CONN="$CONN;Username=$PGUSERNAME"
        CONN="$CONN;Password=$PGPASSWORD_"
        export ConnectionStrings__Yukti="$CONN"
        nohup dotnet src/Yukti.Api/bin/Release/net8.0/Yukti.Api.dll > /tmp/yukti-api.log 2>&1 &
        for i in $(seq 1 30); do
          if curl -sf -o /dev/null http://localhost:5000/swagger/v1/swagger.json; then exit 0; fi
          sleep 1
        done
        echo "API never served swagger.json within 30s:"; cat /tmp/yukti-api.log; exit 1

    - name: Install frontend dependencies
      working-directory: apps/yukti-gui
      run: npm ci

    - name: Regenerate API types and fail on drift
      working-directory: apps/yukti-gui
      run: npm run generate:api && git diff --exit-code src/api/generated

    - name: Show API log on failure
      if: failure()
      run: cat /tmp/yukti-api.log || true

  ai-off:
    # D5-T2: "AI is optional" (SUTRADHAR §2.4), proven against the real
    # running API, not assumed from a config value nobody checked. A dummy
    # key is set deliberately — Ai:Enabled=false must win even when a key
    # LOOKS configured, not only when one happens to be missing (the exact
    # gap GAP-MATRIX's P0-8 finding called out: AI was only ever "off" by
    # omission before this task).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: yukti
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Program.cs's rate limiter (IConnectionMultiplexer, FR-SCHED-03/
      # FR-RT-03) needs a real Redis for ANY rate-limited endpoint to
      # respond at all, login included — not just AI endpoints. Found via
      # this job's own first real run: login 500'd with a
      # RedisConnectionException, not the 503 this job is actually testing
      # for. Port 6380 matches Program.cs's own default
      # (ConnectionStrings:Redis ?? "localhost:6380") with no extra config.
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore and build backend
      run: dotnet restore && dotnet build --no-restore -c Release

    - name: Install Playwright browsers
      run: pwsh tests/Yukti.Orchestration.Tests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

    - name: Install dotnet-ef
      run: dotnet tool install --global dotnet-ef --version 8.0.11

    - name: Apply EF migrations to the throwaway database
      env:
        PGHOST: localhost
        PGPORT: 5432
        PGDATABASE: yukti
        PGUSERNAME: postgres
        PGPASSWORD_: password
      run: |
        CONN="Host=$PGHOST"
        CONN="$CONN;Port=$PGPORT"
        CONN="$CONN;Database=$PGDATABASE"
        CONN="$CONN;Username=$PGUSERNAME"
        CONN="$CONN;Password=$PGPASSWORD_"
        export ConnectionStrings__Yukti="$CONN"
        dotnet ef database update --project src/Yukti.Infrastructure --startup-project src/Yukti.Api --connection "$CONN"

    - name: Run the full non-AI suite with Ai:Enabled=false
      env:
        Ai__Enabled: "false"
        OpenAI__ApiKey: "sk-dummy-key-that-must-never-be-used"
      run: dotnet test --no-build -c Release --verbosity normal

    - name: Start the API with AI disabled and a (deliberately unusable) key present
      env:
        ASPNETCORE_ENVIRONMENT: Production
        Ai__Enabled: "false"
        OpenAI__ApiKey: "sk-dummy-key-that-must-never-be-used"
        PGHOST: localhost
        PGPORT: 5432
        PGDATABASE: yukti
        PGUSERNAME: postgres
        PGPASSWORD_: password
      run: |
        CONN="Host=$PGHOST"
        CONN="$CONN;Port=$PGPORT"
        CONN="$CONN;Database=$PGDATABASE"
        CONN="$CONN;Username=$PGUSERNAME"
        CONN="$CONN;Password=$PGPASSWORD_"
        export ConnectionStrings__Yukti="$CONN"
        nohup dotnet src/Yukti.Api/bin/Release/net8.0/Yukti.Api.dll > /tmp/yukti-api-aioff.log 2>&1 &
        for i in $(seq 1 30); do
          if curl -sf -o /dev/null http://localhost:5000/swagger/v1/swagger.json; then exit 0; fi
          sleep 1
        done
        echo "API never served swagger.json within 30s:"; cat /tmp/yukti-api-aioff.log; exit 1

    - name: Every AI endpoint returns 503 naming AI as disabled, never a quiet fallback
      run: |
        # The AI endpoints require authorization — log in as the seeded
        # bootstrap admin (Program.cs's own dev-only default) to get a real
        # token, the same way any other authenticated-endpoint check would.
        token=$(curl -sf -X POST "http://localhost:5000/api/v1/auth/login" \
          -H "Content-Type: application/json" \
          -d '{"email":"admin@yukti.local","password":"ChangeMe123!"}' | jq -r .accessToken)
        test -n "$token" -a "$token" != "null" || { echo "Could not obtain an access token"; exit 1; }

        # Minimal but complete bodies — each endpoint's request record has
        # non-nullable required fields; an incomplete body fails model
        # binding with a 400 before ever reaching IAiAssistantService, which
        # would make this check pass for the wrong reason.
        declare -A bodies=(
          ["ai/assertions/generate"]='{"method":"GET","url":"https://example.com","statusCode":200,"responseBodyJson":null}'
          ["ai/selectors/heal"]='{"failedSelector":"#gone","targetTag":null,"domSnippet":null,"errorMessage":null,"pageUrl":null}'
          ["ai/flows/suggest"]='{"naturalLanguageDescription":"check the login works","targetBaseUrl":null,"preferredModules":null}'
          # D5-T7: the Sarvagna generation endpoint — its handler isn't even registered with AI
          # off, so this proves that absence reads as a plain 503, never a 500 DI failure.
          ["flows/generate"]='{"description":"check the login works"}'
        )
        for path in "${!bodies[@]}"; do
          status=$(curl -s -o /tmp/ai-off-body.json -w "%{http_code}" -X POST "http://localhost:5000/api/v1/$path" \
            -H "Content-Type: application/json" -H "Authorization: Bearer $token" -d "${bodies[$path]}")
          echo "POST /api/v1/$path -> $status"
          echo "$status" | grep -qx 503 || { echo "Expected 503, got $status for $path"; cat /tmp/ai-off-body.json; exit 1; }
          grep -qi "disabled" /tmp/ai-off-body.json || { echo "503 body doesn't name AI as disabled for $path"; cat /tmp/ai-off-body.json; exit 1; }
        done

    - name: Show API log on failure
      if: failure()
      run: cat /tmp/yukti-api-aioff.log || true

  e2e:
    # D5-T7 / ADR-0005: the real browser against the real stack — Vite + the real API + a real
    # Postgres/Redis + the real flow engine. The only canned piece is the AI's answer
    # (Ai:Provider=fixture, apps/yukti-gui/e2e/fixtures/ai/*.json): zero live AI calls (§R7).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: yukti
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Same reason as the ai-off job: the rate limiter needs a real Redis for login to answer.
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build the API
      run: dotnet build src/Yukti.Api -c Release

    - name: Install dotnet-ef
      run: dotnet tool install --global dotnet-ef --version 8.0.11

    # Connection string assembled from parts, same convention as the ai-off job — this is a
    # throwaway service-container database, but the pieces keep a full credential-bearing
    # connection string literal out of the repo (Sarvaghna's secret rule, rightly, flags one).
    - name: Apply EF migrations to the throwaway database
      env:
        PGHOST: localhost
        PGPORT: 5432
        PGDATABASE: yukti
        PGUSERNAME: postgres
        PGPASSWORD_: password
      run: |
        CONN="Host=$PGHOST"
        CONN="$CONN;Port=$PGPORT"
        CONN="$CONN;Database=$PGDATABASE"
        CONN="$CONN;Username=$PGUSERNAME"
        CONN="$CONN;Password=$PGPASSWORD_"
        export ConnectionStrings__Yukti="$CONN"
        dotnet ef database update --project src/Yukti.Infrastructure --startup-project src/Yukti.Api --connection "$CONN"

    - name: Start the API with the fixture AI provider
      env:
        ASPNETCORE_ENVIRONMENT: Production
        # D6-T5: this job's generated flow calls http://localhost:5000/ (the API's
        # own health check) through the real hosted ApiModule — a deliberate local
        # target, not an SSRF attempt, so it opts into Permissive explicitly rather
        # than inheriting Production's Restricted default (127.0.0.0/8 is denied).
        # The real SSRF proof lives in D6-T5's own OutboundGuardTests, run by
        # build-and-test above, which exercise Restricted mode directly.
        Outbound__Mode: Permissive
        Ai__Enabled: "true"
        Ai__Provider: fixture
        PGHOST: localhost
        PGPORT: 5432
        PGDATABASE: yukti
        PGUSERNAME: postgres
        PGPASSWORD_: password
      run: |
        CONN="Host=$PGHOST"
        CONN="$CONN;Port=$PGPORT"
        CONN="$CONN;Database=$PGDATABASE"
        CONN="$CONN;Username=$PGUSERNAME"
        CONN="$CONN;Password=$PGPASSWORD_"
        export ConnectionStrings__Yukti="$CONN"
        export Ai__FixtureDirectory="$GITHUB_WORKSPACE/apps/yukti-gui/e2e/fixtures/ai"
        nohup dotnet src/Yukti.Api/bin/Release/net8.0/Yukti.Api.dll > /tmp/yukti-api-e2e.log 2>&1 &
        for i in $(seq 1 30); do
          if curl -sf -o /dev/null http://localhost:5000/swagger/v1/swagger.json; then exit 0; fi
          sleep 1
        done
        echo "API never served swagger.json within 30s:"; cat /tmp/yukti-api-e2e.log; exit 1

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: apps/yukti-gui/package-lock.json

    - name: Install frontend dependencies and Playwright's Chromium
      working-directory: apps/yukti-gui
      run: |
        npm ci
        npx playwright install --with-deps chromium

    - name: Run the e2e suite
      working-directory: apps/yukti-gui
      run: npm run test:e2e

    - name: Upload Playwright report and traces on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-e2e
        path: |
          apps/yukti-gui/playwright-report
          apps/yukti-gui/test-results
        retention-days: 7

    - name: Show API log on failure
      if: failure()
      run: cat /tmp/yukti-api-e2e.log || true

  # D6-T6: gates every PR on the real UC-1 flow (demo/uc1_flow.json) actually passing end-to-end
  # through the real CLI -> FlowEngine -> WebModule/ApiModule/LogsModule chain against a real
  # FixtureApp — the same flow D3-T4/T5 proved by hand (7/7, then 50/50 at 0% flake), now enforced
  # on every push instead of trusted from a past session's local run. `yukti run` is explicitly
  # "in-process — no API server, no Postgres" (Yukti.Cli/Program.cs), so this job needs neither.
  uc1-flow-gate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build the CLI and FixtureApp
      run: |
        dotnet build src/Yukti.Cli -c Release
        dotnet build demo/fixtures/FixtureApp -c Release

    - name: Install Playwright browsers
      run: pwsh src/Yukti.Cli/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

    - name: Start FixtureApp
      run: |
        nohup dotnet demo/fixtures/FixtureApp/bin/Release/net8.0/FixtureApp.dll > fixtureapp.log 2>&1 &
        for i in $(seq 1 30); do
          if curl -sf -o /dev/null http://127.0.0.1:5082/login; then exit 0; fi
          sleep 1
        done
        echo "FixtureApp never came up within 30s:"; cat fixtureapp.log; exit 1

    # D6-T6: a flaky failure is re-run once automatically — a run that only passes on the
    # re-run is reported as flaky in the job summary rather than silently green, the same
    # honesty rule D3-T5's own flake-rate measurement already holds the product to.
    - name: Run the UC-1 flow gate
      run: |
        if dotnet src/Yukti.Cli/bin/Release/net8.0/Yukti.Cli.dll run demo/uc1_flow.json --junit uc1-results.xml; then
          echo "UC-1 flow gate passed on the first attempt." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        echo "First attempt failed — re-running once before treating this as a real failure." >&2
        mv uc1-results.xml uc1-results-attempt1.xml 2>/dev/null || true
        if dotnet src/Yukti.Cli/bin/Release/net8.0/Yukti.Cli.dll run demo/uc1_flow.json --junit uc1-results.xml; then
          echo "⚠️ UC-1 flow gate is FLAKY: failed on attempt 1, passed on attempt 2." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        echo "UC-1 flow gate failed on both attempts — a real failure, not a flake." >> "$GITHUB_STEP_SUMMARY"
        exit 1

    - name: Upload JUnit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: uc1-flow-junit
        path: uc1-results*.xml
        if-no-files-found: ignore

    - name: Show FixtureApp log on failure
      if: failure()
      run: cat fixtureapp.log || true

  # D6-T6: `docker compose up` works from a clean clone — proven for real against the actual
  # compose file and Dockerfile (building both images), not asserted from having read them. A
  # fresh checkout has no .env, matching exactly what a new contributor's clean clone would hit.
  docker-compose-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: docker compose up (build + start, clean clone — no .env)
      run: docker compose up -d --build

    - name: Wait for the api service to report healthy
      run: ./scripts/wait-healthy.sh yukti-api 120

    - name: /health returns 200
      run: curl -sf -o /dev/null -w '%{http_code}\n' http://localhost:8080/health

    - name: Worker started cleanly behind api's healthcheck
      run: docker compose logs worker

    - name: Show logs on failure
      if: failure()
      run: docker compose logs

    - name: Tear down
      if: always()
      run: docker compose down -v

  # D6-T7: proves docs/quickstart.md on a genuinely fresh clone, every PR — not by retyping its
  # commands into this file (which can drift from the doc silently) but by extracting the exact
  # fenced blocks the doc itself marks runnable (```bash quickstart) and executing them verbatim.
  # If a step here breaks, the fix is to the doc, never to this job — the job's only job is to
  # run what the doc says, byte for byte.
  quickstart-literal:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Extract every ```bash quickstart block from docs/quickstart.md, in document order
      run: |
        awk '/^```bash quickstart$/{capture=1; next} /^```$/{capture=0} capture' docs/quickstart.md > quickstart-extracted.sh
        echo "--- extracted script ---"
        cat quickstart-extracted.sh
        test -s quickstart-extracted.sh || { echo "No \`\`\`bash quickstart blocks found — the doc's own markers are missing or renamed."; exit 1; }

    - name: Run the quickstart, verbatim
      run: bash -euo pipefail quickstart-extracted.sh

    - name: Show logs on failure
      if: failure()
      run: docker compose logs

    - name: Tear down
      if: always()
      run: docker compose down -v
