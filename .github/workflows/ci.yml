name: Yukti Platform CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Verify formatting
      run: dotnet format --verify-no-changes

    - name: Build Solution (warnings as errors)
      run: dotnet build --no-restore -warnaserror -c Release

    - name: Run .NET Unit & Integration Tests
      run: dotnet test --no-build -c Release --verbosity normal

    - name: Build Docker Container
      run: docker build -t yukti-platform:latest .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/yukti-gui

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: apps/yukti-gui/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Test
      run: npm test

    - name: Build
      run: npm run build
