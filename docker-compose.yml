version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: yukti-postgres
    environment:
      POSTGRES_DB: yukti
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yukti"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yukti-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # D6-T7: dev-mode Vault — unsealed, in-memory, no persisted volume (owner's own call, recorded
  # in the Day 6 spec's open questions: dev mode for v0.1, production-mode Vault with real unseal
  # keys is v0.2 hosting work). The root token below is a well-known dev-only value, safe only
  # because this container is thrown away with every `docker compose down`; never used outside
  # local/demo compose.
  vault:
    image: hashicorp/vault:1.17
    container_name: yukti-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: yukti-dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yukti-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # D6-T6: docker-entrypoint.sh assembles ConnectionStrings__Yukti from these pieces at
      # container start — no file ever commits one static "Host=...;Password=..." literal. A clean
      # clone has no .env, so these defaults (the same dev-only credentials the postgres service
      # above already declares inline) are what make `docker compose up` work out of the box;
      # override them for anything beyond local/demo use.
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=${POSTGRES_DB:-yukti}
      - PGUSER=${POSTGRES_USER:-postgres}
      - PGPASSWORD=${POSTGRES_PASSWORD:-password}
      - ConnectionStrings__Redis=redis:6379
      - Deployment__SelfHosted=true
      - Cors__AllowedOrigins__0=http://localhost:5173
      # D6-T7: without these, Program.cs's own `vaultConfigured` check (VAULT_TOKEN unset) falls
      # back to InMemoryCredentialResolver — real, but it means a clean `docker compose up` would
      # never actually exercise the real Vault path at all. Dev-only token, matches the vault
      # service's own VAULT_DEV_ROOT_TOKEN_ID above.
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=yukti-dev-root-token
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yukti-worker
    command: ["./worker/Yukti.Worker.dll"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # D6-T6: api runs EF migrations on startup (Program.cs) — a clean volume has no tables until
      # that finishes. Waiting on api's own healthcheck (not just postgres/redis being up) is what
      # stops worker from racing ahead and querying tables that don't exist yet.
      api:
        condition: service_healthy
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=${POSTGRES_DB:-yukti}
      - PGUSER=${POSTGRES_USER:-postgres}
      - PGPASSWORD=${POSTGRES_PASSWORD:-password}
      - ConnectionStrings__Redis=redis:6379
      - Deployment__SelfHosted=true

volumes:
  postgres_data:
  redis_data:
